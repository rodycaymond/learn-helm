ui:
  port: 8000
  targetPort: 80
  image: rodycaymond/test-image-suite
  tag: latest
  name: frontend

api:
  port: 8080
  targetPort: 8080
  image: rodycaymond/test-api
  tag: latest
  name: backend
  environment:
    TEST: "BONG"

db:
