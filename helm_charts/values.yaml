  tag: latest
  serviceName: postgres
  port: 5432
  targetPort: 5423
  DB_NAME: test_database
  DB_PORT: 5432
  DB_USER: admin
  DB_PASSWORD: password
  DB_HOST: postgres

ingress:
  name: nginx-ingress

app:
  name: test-app
