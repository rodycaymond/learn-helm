apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: helm.test.cody
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: frontend
                port:
                  number: 8000
          - pathType: Prefix
            path: /api
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - pathType: Prefix
            path: /oauth2
            backend:
              service:
                name: oauth2proxy
                port:
                  number: 4180
