apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Values.ingress.name }}"
spec:
  ingressClassName: nginx
  rules:
    - host: helm.test.cody
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: "{{ .Values.ui.name }}"
                port:
                  number: 8000
          - pathType: Prefix
            path: /api
            backend:
              service:
                name: "{{ .Values.api.name }}"
                port:
                  number: 8080
  env:
    - name: FRONTEND_HOST
      value: "{{ .Values.ingress.FRONTEND_HOST }}"
    - name: FRONTEND_PORT
      value: "{{ .Values.ingress.FRONTEND_PORT }}"
    - name: BACKEND_HOST
      value: "{{ .Values.ingress.BACKEND_HOST }}"
    - name: BACKEND_PORT
      value: "{{ .Values.ingress.BACKEND_PORT }}"
